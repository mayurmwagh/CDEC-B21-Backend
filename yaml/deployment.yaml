apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-app
  labels:
    app: backend-app 
spec:
  selector:
    matchLabels:
      app: backend-app 
  replicas: 2 
  template:
    metadata:
      labels:
        app: backend-app
    spec:
      containers:
        - name: backend-app
          image: mayurwagh/CDEC-B21-Backend:latest
          ports:
            - containerPort: 8080